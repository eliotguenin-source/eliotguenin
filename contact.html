<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Eliot Guenin</title>
  <link rel="stylesheet" href="contact.css">
  <script src="lang.js"></script>
  <style>
    header{ position: relative; }
    #lang-toggle{ position: absolute; right: 16px; top: 12px; background: rgba(0,0,0,0.6); color: white; border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  </style>
</head>

  <body>
    <header>
        <a class="font-size" href="index.html">Eliot Guenin</a>
      <nav class="font-size">
  <a class="font-size" href="about.html" data-i18n="nav_about">about</a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

<a class="font-size" href="research.html" data-i18n="nav_research">research</a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

<a class="font-size" href="works.html" data-i18n="nav_works">works</a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

<a class="font-size" href="contact.html" data-i18n="nav_contact">contact</a> 
      </nav>
      <button id="lang-toggle" aria-label="Toggle language" type="button">FR</button>
    </header>

  <main class="contact-page">
    <section class="font-size">
      <h1 data-i18n="contact_heading">Contact</h1>
      <p data-i18n="contact_intro">If you'd like to get in touch, fill out the form below or email me directly.</p>

      <form id="contactForm" class="contact-form">
        <div class="name-row">
          <div class="field">
            <label for="firstName" data-i18n="form_firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required minlength="2" autocomplete="given-name" data-i18n="form_firstName">
          </div>
          <div class="field">
            <label for="lastName" data-i18n="form_lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required minlength="2" autocomplete="family-name" data-i18n="form_lastName">
          </div>
        </div>
<br>
        <label for="email" data-i18n="form_email">Email</label>
        <br>
        <input id="email" name="email" type="email" required autocomplete="email">
 <br> <br>
        <label for="subject" data-i18n="form_subject">Subject</label>
         <br>
        <input id="subject" name="subject" type="text">
        <br>
        <br>
<br>
        <label for="message" data-i18n="form_message">Message</label>  <br>
        <textarea id="message" name="message" rows="6" required data-i18n="form_message"></textarea>

        <div class="form-actions">
          <button type="submit" data-i18n="form_submit">Send Message</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>

      <div class="contact-meta">
        <p  ><strong >Email:</strong> <a class="font-size" href="eliot.guenin@gmail.com">eliot.guenin@gmail.com</a> </p>
      </div>
    </section>
<br><br><br>
    <aside class="font-size">
      <h2 data-i18n="contact_other_ways">Other ways to reach me</h2>
      <ul>
     <a class="font-size" href="https://www.linkedin.com/in/eliot-guenin-074209330/" data-i18n="contact_linkedin">Eliot Guenin - LinkedIn Profile</a>
      </ul>
    </aside>
  </main>

    <footer class="site-footer">
      <p>&copy; Photo : Inès-Renée Canadas <span id="year"></span></p>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var first = form.firstName.value.trim();
      var last = form.lastName.value.trim();
      var name = (first + ' ' + last).trim();
      var email = form.email.value.trim();
      var subject = form.subject.value.trim() || 'Contact from website';
      var message = form.message.value.trim();

      if (!first || !last || !email || !message) {
        document.getElementById('status').textContent = (window.t && window.t('form_required')) || 'Please complete all required fields.';
        return;
      }

      // Configure a Formspree endpoint here (e.g. https://formspree.io/f/yourformid)
      var FORMSPREE_ENDPOINT = 'https://formspree.io/f/mppalyab';
      if (!FORMSPREE_ENDPOINT) {
        document.getElementById('status').textContent = (window.t && window.t('form_not_configured')) || 'Form not configured. Set FORMSPREE_ENDPOINT in the script to enable in-browser sending.';
        return;
      }

      var formData = new FormData();
      formData.append('firstName', first);
      formData.append('lastName', last);
      formData.append('email', email);
      formData.append('subject', subject);
      formData.append('message', message);
      formData.append('_subject', subject);
      formData.append('_replyto', email);

      document.getElementById('status').textContent = (window.t && window.t('sending')) || 'Sending…';

      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      }).then(function(response) {
        if (response.ok) {
          document.getElementById('status').textContent = (window.t && window.t('sent_success')) || 'Message sent — thank you!';
          form.reset();
        } else {
          return response.json().then(function(data) {
            document.getElementById('status').textContent = (data && data.error) ? data.error : ((window.t && window.t('submission_failed')) || 'Submission failed.');
          });
        }
      }).catch(function(err) {
        document.getElementById('status').textContent = (window.t && window.t('network_error')) || 'Network error. Please try again later.';
      });
    });
  </script>
</body>
</html>
