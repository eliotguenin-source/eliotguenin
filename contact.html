<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="contact.css">
</head>

  <body>
    <header>
        <a class="font-size" href="index.html">Eliot Guenin</a>
      <nav class="font-size">

      </nav>
    </header>
<br><br><br>  <br><br><br>  <br><br><br>  <br><br><br>  <br><br><br><br><br>   
  <main class="contact-page">
    <section class="font-size">
      <h1>Contact</h1>
      <p>If you'd like to get in touch, fill out the form below or email me directly.</p>

      <form id="contactForm" class="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required minlength="2" autocomplete="name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <div class="form-actions">
          <button type="submit">Send Message</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>

      <div class="contact-meta">
        <p  ><strong >Email:</strong> <a class="font-size" href="eliot.guenin@gmail.com">eliot.guenin@gmail.com</a> </p>
      </div>
    </section>
<br><br><br>
    <aside class="font-size">
      <h2>Other ways to reach me</h2>
      <ul>
     <a class="font-size" href="https://www.linkedin.com/in/eliot-guenin-074209330/">Eliot Guenin - LinkedIn Profile</a>
      </ul>
    </aside>
  </main>

  <footer class="Footer">
    <p>&copy;  Photo : Inès-Renée Canadas <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var name = form.name.value.trim();
      var email = form.email.value.trim();
      var subject = form.subject.value.trim() || 'Contact from website';
      var message = form.message.value.trim();

      if (!name || !email || !message) {
        document.getElementById('status').textContent = 'Please complete all required fields.';
        return;
      }

      var body = 'Name: ' + name + '\nEmail: ' + email + '\n\n' + message;
      var mailto = 'mailto:you@example.com'
        + '?subject=' + encodeURIComponent(subject)
        + '&body=' + encodeURIComponent(body);

      // Try opening the user's email client. This is a graceful fallback for sites without a backend.
      window.location.href = mailto;
      document.getElementById('status').textContent = 'Opening your email client...';

      // Optionally, clear the form after a short delay
      setTimeout(function(){ form.reset(); }, 800);
    });
  </script>
</body>
</html>
